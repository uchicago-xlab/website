/* ---------- panel (task detail) ---------- */

.step input.step-text { border: 0; background: none; width: 100%; padding: 3px 4px; font-size: 13.5px; border-radius: 5px; }
.step input.step-text:focus { outline: none; background: var(--bg); }
.step.done input.step-text { color: var(--ink-3); text-decoration: line-through; }

.step.drag-over { box-shadow: inset 0 2px 0 var(--maroon); }
.step-add { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line-2); background: #fcfcfd; }
.step-add input { border: 0; background: none; flex: 1; padding: 4px; font-size: 13.5px; outline: none; }
.step-due { font-size: 11.5px; color: var(--ink-3); border: 0; background: none; padding: 2px 4px; border-radius: 5px; }
.step-due.overdue { color: var(--bad); font-weight: 700; }

.links { display: grid; gap: 6px; }
.link-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
.link-row:hover { border-color: #d1d4d9; }
.link-row .lk { flex: 1; min-width: 0; }
.link-row .lk a { font-weight: 600; color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-row .lk .u { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; flex: none; }
.link-add { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.link-add .input { flex: 1; min-width: 180px; padding: 6px 10px; font-size: 13px; }

.feed { display: grid; gap: 14px; }
.feed-item { display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.feed-item .who { font-weight: 600; font-size: 13px; }
.feed-item .when { color: var(--ink-3); font-size: 12px; margin-left: 6px; }
.feed-item .body { margin-top: 3px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.feed-item.activity { grid-template-columns: 28px 1fr; color: var(--ink-3); font-size: 12.5px; align-items: center; }
.feed-item.activity .act-dot { width: 28px; display: grid; place-items: center; }
.feed-item.checkin .bubble { border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 8px 10px; margin-top: 4px; background: #fcfcfd; }
.feed-item .del { opacity: 0; font-size: 11px; color: var(--ink-3); border: 0; background: none; margin-left: 6px; }
.feed-item:hover .del { opacity: 1; }
.composer { border: 1px solid var(--line); border-radius: 10px; background: #fff; position: relative; }
.composer textarea { border: 0; width: 100%; resize: none; padding: 10px 12px; min-height: 60px; font-size: 13.5px; outline: none; border-radius: 10px; display: block; }
.composer-foot { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.composer-foot .spacer { flex: 1; }
.health-choice { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.health-choice button { border: 0; background: #fff; padding: 5px 10px; font-size: 12px; font-weight: 600; display: flex; gap: 5px; align-items: center; border-left: 1px solid var(--line); }
.health-choice button:first-child { border-left: 0; }
.health-choice button.on { background: var(--line-2); }
.seg { display: inline-flex; background: var(--line-2); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 12px; }
.banner.warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
.banner.bad { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.banner.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.banner.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.banner .spacer { flex: 1; }

/* ---------- popovers, modals, toasts ---------- */
.pop { position: fixed; z-index: 60; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); min-width: 220px; max-width: 320px; max-height: 360px; display: flex; flex-direction: column; overflow: hidden; }
.pop input.pop-search { border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; outline: none; font-size: 13.5px; }
.pop-list { overflow-y: auto; padding: 4px; }
.pop-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 7px; border: 0; background: none; width: 100%; text-align: left; font-size: 13.5px; }
.pop-item:hover, .pop-item.hl { background: var(--line-2); }
.pop-item .sub { color: var(--ink-3); font-size: 12px; margin-left: auto; padding-left: 8px; white-space: nowrap; }
.pop-item.checked::after { content: '✓'; margin-left: auto; color: var(--maroon); font-weight: 700; }
.pop-group { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 4px; }
.pop-sep { height: 1px; background: var(--line); margin: 4px 0; }
.modal-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(15, 15, 20, .4); display: grid; place-items: start center; padding: 8vh 16px 16px; overflow-y: auto; }
.modal { background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); width: min(560px, 100%); }
.modal.wide { width: min(760px, 100%); }
.modal-head { padding: 16px 20px 0; display: flex; align-items: center; gap: 10px; }
.modal-head h2 { margin: 0; font-size: 18px; }
.modal-body { padding: 14px 20px; }
.modal-foot { padding: 12px 20px 16px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.modal-foot .spacer { flex: 1; }
.palette { width: min(620px, 100%); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; font-size: 16px; outline: none; }
.palette .pop-list { max-height: 420px; padding: 6px; }
.palette .pop-item { padding: 9px 10px; }
.toasts { position: fixed; left: 16px; bottom: 16px; z-index: 80; display: grid; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: #1f1d1d; color: #fff; padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; animation: toastIn .2s ease; line-height: 1.4; }
.toast.err { background: #7f1d1d; }
.toast.slack { background: #3f0e40; }
.toast button { background: none; border: 0; color: #f3c1c1; font-weight: 700; padding: 0; margin-left: auto; white-space: nowrap; }
.toast .t-ico { flex: none; margin-top: 1px; }
@keyframes toastIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- dashboard / people / docs ---------- */
.team-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; }
.team-card:hover { border-color: #d0d3d8; }
.team-card .tc-head { display: flex; align-items: center; gap: 10px; }
.team-card .tc-name { font-weight: 700; font-size: 15px; }
.tc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tc-stat { background: var(--bg); border-radius: 7px; padding: 6px 8px; }
.tc-stat .n { font-weight: 700; font-size: 16px; }
.tc-stat .l { font-size: 11px; color: var(--ink-3); }
.tc-stat.bad .n { color: var(--bad); }
.tc-stat.warn .n { color: var(--warn); }
.health-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.table { width: 100%; border-collapse: collapse; background: #fff; }
.table th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: #fafafb; }
.load-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line-2); min-width: 100px; }
.load-bar span { display: block; height: 100%; }
.person-card { padding: 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; }
.person-card:hover { border-color: #d0d3d8; }
.person-card .pn { font-weight: 700; }
.person-card .pt { font-size: 12px; color: var(--ink-3); }
.doc-card { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.doc-card .dt { font-weight: 600; color: var(--ink); }
.doc-card .dn { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.tpl-card { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tpl-card ol { margin: 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); }
.tpl-card ol li { margin: 2px 0; }
.attention-item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line-2); align-items: flex-start; cursor: pointer; }
.attention-item:first-child { border-top: 0; padding-top: 2px; }
.attention-item .ai-title { font-weight: 600; font-size: 13px; }
.attention-item .ai-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
.inbox-item { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line-2); cursor: pointer; align-items: start; background: #fff; }
.inbox-item:first-child { border-top: 0; }
.inbox-item:hover { background: #fafafb; }
.inbox-item.unread { background: #fffafa; }
.inbox-item.unread .ii-title::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--maroon); margin-right: 7px; vertical-align: middle; }
.ii-title { font-size: 13.5px; }
.ii-task { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.ii-body { font-size: 13px; color: var(--ink-2); margin-top: 4px; white-space: pre-wrap; line-height: 1.45; }
.ii-when { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.int-card { padding: 16px 18px; }
.int-card .int-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.int-logo { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 14px; }
.status-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.status-tag.on { background: #e9f7ee; color: #127a39; }
.status-tag.off { background: var(--line-2); color: var(--ink-3); }
.welcome-habits { display: grid; gap: 10px; margin: 14px 0 4px; }
.habit { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
.habit .hn { width: 26px; height: 26px; border-radius: 50%; background: var(--maroon); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.habit b { display: block; margin-bottom: 2px; }
.habit span { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.loading { display: grid; place-items: center; height: 100vh; color: var(--ink-3); gap: 10px; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--maroon); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.sync-dot.busy { background: var(--warn); }
.sync-dot.err { background: var(--bad); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .home-grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; z-index: 50; transform: translateX(-100%); transition: transform .2s; }
  .app.nav-open .sidebar { transform: none; box-shadow: var(--shadow-lg); }
  .app.nav-open .nav-scrim { display: block; position: fixed; inset: 0; z-index: 49; background: rgba(0, 0, 0, .3); }
  .menu-btn { display: inline-grid; }
  .topbar { padding: 10px 14px; }
  .tabs { padding: 0 10px; }
  .content { padding: 16px 14px 80px; }
  .search-btn { min-width: 0; }
  .search-btn .lbl, .search-btn kbd { display: none; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .task-row .meta .hide-sm { display: none; }
  .fields { grid-template-columns: 96px 1fr; }
  .panel-body { padding: 14px 16px 40px; }
  .grid-2 { grid-template-columns: 1fr; }
  .tl-label-col { width: 160px; }
  .board { padding: 14px; }
  .topbar .new-label { display: none; }
  .hide-sm, .section-title .muted { display: none !important; }
  .panel-head { gap: 4px; padding: 8px 10px; }
  .panel-head .btn { padding: 6px 9px; }
  .panel { width: 100vw; }
  .link-add .input { min-width: 0; }
}
@media print {
  .sidebar, .topbar .search-btn, .panel, .scrim { display: none !important; }
  .app { display: block; height: auto; }
  .content { overflow: visible; }
}

<div id="app"><div class="loading"><div class="spinner"></div><span>Loading the tracker…</span></div></div>
<noscript>The tracker needs JavaScript.</noscript>
<script>
/* core.js */
/* ==========================================================================
   Tracker core: data model, permissions and every state change.

   This file runs in two places:
     1. the browser (tracker/index.html), and
     2. the Google Apps Script backend (copied to Core.gs by the build script).
   Keep it free of DOM and Apps Script APIs so both can use it. All changes to
   the data go through applyOp(), so the server can re-run exactly the same
   permission checks and logic the browser ran optimistically.
   ========================================================================== */
var TrackerCore = (function () {
  'use strict';

  var STATUSES = [
    { id: 'todo', label: 'Not started', color: '#7a808a' },
    { id: 'doing', label: 'In progress', color: '#2563eb' },
    { id: 'blocked', label: 'Blocked', color: '#dc2626' },
    { id: 'review', label: 'In review', color: '#9333ea' },
    { id: 'done', label: 'Done', color: '#16a34a' }
  ];
  var PRIORITIES = [
    { id: 'low', label: 'Low', color: '#94a3b8', rank: 0 },
    { id: 'med', label: 'Medium', color: '#0ea5e9', rank: 1 },
    { id: 'high', label: 'High', color: '#f59e0b', rank: 2 },
    { id: 'urgent', label: 'Urgent', color: '#dc2626', rank: 3 }
  ];
  var HEALTH = [
    { id: 'on', label: 'On track', color: '#16a34a' },
    { id: 'risk', label: 'At risk', color: '#f59e0b' },
    { id: 'off', label: 'Off track', color: '#dc2626' }
  ];
  var ROLES = [
    { id: 'exec', label: 'Exec' },
    { id: 'lead', label: 'Team lead' },
    { id: 'member', label: 'Member' }
  ];
  var COLLECTIONS = ['teams', 'people', 'projects', 'tasks', 'templates', 'resources'];
  // A task with no check-in for this many days is flagged as needing an update.
  var STALE_DAYS = 7;
  // Owners can be nudged at most once per this many hours.
  var NUDGE_COOLDOWN_HOURS = 12;

  /* ---------- small utilities ---------- */
  function uid(prefix) {
    return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function nowIso() { return new Date().toISOString(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dateKey(new Date()); }
  function parseDateKey(k) {
    if (!k) return null;
    var p = String(k).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(k, n) {
    var d = parseDateKey(k); d.setDate(d.getDate() + n); return dateKey(d);
  }
  function daysBetween(a, b) {
    // whole days from date key a to date key b
    return Math.round((parseDateKey(b) - parseDateKey(a)) / 86400000);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function find(list, fn) {
    for (var i = 0; i < list.length; i++) if (fn(list[i])) return list[i];
    return null;
  }
  function has(arr, v) { return !!arr && arr.indexOf(v) !== -1; }
  function trimStr(s, max) { s = String(s == null ? '' : s).trim(); return max ? s.slice(0, max) : s; }
  function isHttpUrl(u) { return /^https?:\/\/[^\s]+$/i.test(String(u || '').trim()); }

  function emptyState() {
    return { teams: [], people: [], projects: [], tasks: [], templates: [], resources: [], meta: {} };
  }

  /* ---------- look-ups ---------- */
  function person(state, id) { return byId(state.people, id); }
  function team(state, id) { return byId(state.teams, id); }
  function task(state, id) { return byId(state.tasks, id); }
  function personByEmail(state, email) {
    if (!email) return null;
    email = String(email).toLowerCase();
    return find(state.people, function (p) { return !p.deleted && p.email && p.email.toLowerCase() === email; });
  }
  function activePeople(state) { return state.people.filter(function (p) { return !p.deleted; }); }
  function activeTasks(state) { return state.tasks.filter(function (t) { return !t.deleted; }); }
  function teamLeads(state, teamId) {
    // Leads of a team; exec members count as leads of any team they are listed on (e.g. the Exec team).
    return activePeople(state).filter(function (p) { return (p.role === 'lead' || p.role === 'exec') && has(p.teams, teamId); });
  }
  function teamMembers(state, teamId) {
    return activePeople(state).filter(function (p) { return has(p.teams, teamId); });
  }
  function isExec(p) { return !!p && p.role === 'exec'; }
  function isLeadOf(p, teamId) { return !!p && p.role === 'lead' && has(p.teams, teamId); }

  /* ---------- permissions ----------
     Everyone can see everything (transparency is the point). Editing is open to
     the task's team, its owner/collaborators and its creator; exec can do anything. */
  function canEditTask(state, pid, t) {
    var p = person(state, pid);
    if (!p || !t) return false;
    if (isExec(p)) return true;
    if (t.owner === pid || t.createdBy === pid || has(t.collaborators, pid)) return true;
    return has(p.teams, t.team);
  }
  function canDeleteTask(state, pid, t) {
    var p = person(state, pid);
    if (!p || !t) return false;
    return isExec(p) || isLeadOf(p, t.team) || t.createdBy === pid;
  }
  function canToggleStep(state, pid, t, step) {
    return canEditTask(state, pid, t) || (!!step && step.assignee === pid);
  }
  function canManagePeople(state, pid) {
    var p = person(state, pid);
    return !!p && (p.role === 'exec' || p.role === 'lead');
  }
  function canEditPerson(state, pid, target, patch) {
    var p = person(state, pid);
    if (!p) return false;
    if (isExec(p)) return true;
    var touchesRole = patch && ('role' in patch || 'teams' in patch || 'email' in patch);
    if (target && target.id === pid && !touchesRole) return true;
    if (p.role === 'lead') {
      // Leads manage members of their own teams, but cannot promote anyone.
      if (patch && patch.role && patch.role !== 'member') return false;
      if (target && target.role && target.role !== 'member') return false;
      var teams = (patch && patch.teams) || (target && target.teams) || [];
      return teams.length > 0 && teams.every(function (tid) { return has(p.teams, tid); });
    }
    return false;
  }
  function canEditProject(state, pid, proj) {
    var p = person(state, pid);
    return !!p && (isExec(p) || (proj && isLeadOf(p, proj.team)) || (proj && proj.createdBy === pid));
  }
  function canEditShared(state, pid, item) {
    // templates and resources: anyone can add; creator, exec and that team's lead can change
    var p = person(state, pid);
    if (!p) return false;
    if (!item || !item.createdBy) return true;
    return isExec(p) || item.createdBy === pid || (item.team && isLeadOf(p, item.team));
  }

  /* ---------- derived values ---------- */
  function isDone(t) { return t.status === 'done'; }
  function isOverdue(t, today) {
    return !isDone(t) && !!t.dueDate && t.dueDate < (today || todayKey());
  }
  function lastTouch(t) {
    return t.lastCheckinAt || t.createdAt;
  }
  function staleDays(t) {
    if (isDone(t) || t.status === 'todo') return 0;
    var last = lastTouch(t);
    if (!last) return 0;
    return Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
  }
  function isStale(t) { return staleDays(t) >= STALE_DAYS; }
  function stepProgress(t) {
    var steps = t.steps || [];
    var done = steps.filter(function (s) { return s.done; }).length;
    return { done: done, total: steps.length, pct: steps.length ? Math.round(100 * done / steps.length) : (isDone(t) ? 100 : 0) };
  }
  function openHelp(t) { return (t.help || []).filter(function (h) { return h.status === 'open'; }); }
  function involves(t, pid) {
    if (t.owner === pid || has(t.collaborators, pid)) return true;
    return (t.steps || []).some(function (s) { return s.assignee === pid && !s.done; });
  }
  function dueBucket(t, today) {
    today = today || todayKey();
    if (isDone(t)) return 'done';
    if (!t.dueDate) return 'nodate';
    var d = daysBetween(today, t.dueDate);
    if (d < 0) return 'overdue';
    if (d === 0) return 'today';
    if (d <= 7) return 'week';
    return 'later';
  }
  function priorityRank(id) {
    var p = find(PRIORITIES, function (x) { return x.id === id; });
    return p ? p.rank : 1;
  }
  function compareTasks(a, b) {
    // Undated tasks last; then by due date, then priority (highest first), then title.
    if (isDone(a) !== isDone(b)) return isDone(a) ? 1 : -1;
    var ad = a.dueDate || '9999', bd = b.dueDate || '9999';
    if (ad !== bd) return ad < bd ? -1 : 1;
    var pr = priorityRank(b.priority) - priorityRank(a.priority);
    if (pr) return pr;
    return String(a.title).localeCompare(String(b.title));
  }
  function mentionsIn(state, text) {
    // @First or @First Last (matches against people's names, longest match wins)
    var ids = [];
    if (!text || text.indexOf('@') === -1) return ids;
    var lower = text.toLowerCase();
    var people = activePeople(state).slice().sort(function (a, b) { return b.name.length - a.name.length; });
    people.forEach(function (p) {
      var full = '@' + p.name.toLowerCase();
      var first = '@' + p.name.split(' ')[0].toLowerCase();
      var hit = lower.indexOf(full) !== -1;
      if (!hit) {
        var re = new RegExp(first.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![a-z])');
        hit = re.test(lower);
      }
      if (hit && ids.indexOf(p.id) === -1) ids.push(p.id);
    });
    return ids;
  }

  /* ---------- constructors ---------- */
  function newTask(fields, actorId) {
    var at = nowIso();
    var t = {
      id: uid('t'), title: '', description: '', team: null, project: null,
      status: 'todo', priority: 'med', owner: null, collaborators: [],
      startDate: null, dueDate: null, steps: [], links: [], help: [], feed: [],
      health: null, lastCheckinAt: null, lastNudgeAt: null,
      createdBy: actorId || null, createdAt: at, updatedAt: at, completedAt: null, deleted: false
    };
    for (var k in fields) if (Object.prototype.hasOwnProperty.call(fields, k)) t[k] = fields[k];
    return t;
  }
  function newStep(text, extra) {
    var s = { id: uid('s'), text: trimStr(text, 500), done: false, assignee: null, due: null, doneAt: null, doneBy: null };
    if (extra) for (var k in extra) s[k] = extra[k];
    return s;
  }
  function linkKind(url) {
    url = String(url || '');
    if (/docs\.google\.com\/document/.test(url)) return 'doc';
    if (/docs\.google\.com\/spreadsheets/.test(url)) return 'sheet';
    if (/docs\.google\.com\/presentation/.test(url)) return 'slides';
    if (/docs\.google\.com\/forms|forms\.gle/.test(url)) return 'form';
    if (/drive\.google\.com\/drive\/(u\/\d+\/)?folders/.test(url)) return 'folder';
    if (/drive\.google\.com/.test(url)) return 'drive';
    if (/slack\.com/.test(url)) return 'slack';
    if (/calendar\.google\.com|calendar\.app\.google/.test(url)) return 'calendar';
    if (/\.pdf(\?|#|$)/i.test(url)) return 'pdf';
    if (/github\.com/.test(url)) return 'github';
    if (/notion\.(so|site)/.test(url)) return 'notion';
    if (/canva\.com|figma\.com/.test(url)) return 'design';
    return 'link';
  }
  function titleFromUrl(url) {
    try {
      var m = String(url).match(/^https?:\/\/([^/]+)(\/[^?#]*)?/i);
      if (!m) return url;
      var host = m[1].replace(/^www\./, '');
      var kind = linkKind(url);
      var names = { doc: 'Google Doc', sheet: 'Google Sheet', slides: 'Google Slides', form: 'Google Form', folder: 'Drive folder', drive: 'Drive file' };
      if (names[kind]) return names[kind];
      var last = (m[2] || '').split('/').filter(Boolean).pop();
      return last ? host + ' / ' + decodeURIComponent(last).slice(0, 40) : host;
    } catch (e) { return url; }
  }

  /* ---------- applyOp ----------
     Every change is an op: { type, ... }. Returns
       { ok: true, changed: [{coll, id}], events: [...] }  or  { ok: false, error }.
     Events describe who should hear about the change; the server turns them into
     Slack messages, and the browser shows them in Inbox. */
  function fail(msg) { return { ok: false, error: msg }; }

  function applyOp(state, op, actorId) {
    try {
      return applyOpInner(state, op, actorId);
    } catch (e) {
      return fail(e && e.message ? e.message : String(e));
    }
  }

  function applyOpInner(state, op, actorId) {
    var at = nowIso();
    var changed = [];
    var events = [];
    var actor = person(state, actorId);
    if (!op || !op.type) return fail('Malformed change.');
    if (!actor && op.type !== 'join') return fail('You are not on the roster yet.');

    function touch(coll, item) {
      item.updatedAt = at;
      changed.push({ coll: coll, id: item.id });
    }
    function log(t, entry) {
      entry.id = entry.id || uid('f');
      entry.by = actorId;
      entry.at = at;
      t.feed = t.feed || [];
      t.feed.push(entry);
      // keep the sheet cell well under Google's 50k character limit
      if (t.feed.length > 300) t.feed = t.feed.slice(-300);
    }
    function emit(type, t, to, extra) {
      to = (to || []).filter(function (id) { return id && id !== actorId; });
      var ev = { type: type, taskId: t ? t.id : null, by: actorId, to: to, at: at };
      if (extra) for (var k in extra) ev[k] = extra[k];
      events.push(ev);
    }
    function getTask(id) {
      var t = task(state, id);
      if (!t || t.deleted) throw new Error('That task no longer exists.');
      return t;
    }
    function requireEdit(t) {
      if (!canEditTask(state, actorId, t)) throw new Error('Only the ' + teamName(state, t.team) + ' team, the owner or collaborators can edit this task. You can still comment or ask for help.');
    }

    switch (op.type) {
      /* ----- tasks ----- */
      case 'createTask': {
        var f = op.task || {};
        if (!trimStr(f.title)) return fail('A task needs a title.');
        if (!team(state, f.team)) return fail('Pick a team for the task.');
        var t = newTask({}, actorId);
        ['id', 'title', 'description', 'team', 'project', 'status', 'priority', 'owner', 'collaborators', 'startDate', 'dueDate', 'steps', 'links'].forEach(function (k) {
          if (f[k] !== undefined && f[k] !== null) t[k] = clone(f[k]);
        });
        if (task(state, t.id)) return fail('Duplicate task id.');
        t.title = trimStr(t.title, 300);
        state.tasks.push(t);
        log(t, { kind: 'activity', action: 'created' });
        if (t.owner && t.owner !== actorId) {
          t.feed[t.feed.length - 1].notify = [t.owner];
          emit('assigned', t, [t.owner]);
        }
        touch('tasks', t);
        break;
      }
      case 'updateTask': {
        var t = getTask(op.id);
        requireEdit(t);
        var patch = op.patch || {};
        var allowed = ['title', 'description', 'team', 'project', 'status', 'priority', 'owner', 'collaborators', 'startDate', 'dueDate'];
        Object.keys(patch).forEach(function (k) {
          if (allowed.indexOf(k) === -1) return;
          var before = t[k], after = patch[k];
          if (JSON.stringify(before) === JSON.stringify(after)) return;
          if (k === 'title') { after = trimStr(after, 300); if (!after) return; }
          if (k === 'team' && !team(state, after)) return;
          t[k] = clone(after);
          if (k === 'status') {
            log(t, { kind: 'activity', action: 'status', value: after, from: before });
            if (after === 'done') {
              t.completedAt = at;
              var watchers = [t.createdBy].concat(teamLeads(state, t.team).map(function (p) { return p.id; }));
              emit('done', t, watchers);
            } else {
              t.completedAt = null;
            }
            if (after === 'blocked') {
              var leads = teamLeads(state, t.team).map(function (p) { return p.id; });
              t.feed[t.feed.length - 1].notify = leads.filter(function (id) { return id !== actorId; });
              emit('blocked', t, leads.concat([t.owner]));
            }
            if (after === 'review') {
              var reviewers = teamLeads(state, t.team).map(function (p) { return p.id; });
              if (t.createdBy && t.createdBy !== t.owner) reviewers.push(t.createdBy);
              t.feed[t.feed.length - 1].notify = reviewers.filter(function (id) { return id !== actorId; });
              emit('review', t, reviewers);
            }
          } else if (k === 'owner') {
            log(t, { kind: 'activity', action: 'owner', value: after, notify: after && after !== actorId ? [after] : [] });
            if (after) emit('assigned', t, [after]);
          } else if (k === 'dueDate') {
            log(t, { kind: 'activity', action: 'due', value: after, from: before });
            if (t.owner && before) emit('dueChanged', t, [t.owner], { from: before, value: after });
          } else if (k === 'collaborators') {
            var added = (after || []).filter(function (id) { return !has(before, id); });
            if (added.length) {
              log(t, { kind: 'activity', action: 'collaborators', value: added, notify: added });
              emit('collaborator', t, added);
            }
          } else if (k === 'team') {
            log(t, { kind: 'activity', action: 'team', value: after, from: before });
          } else if (k === 'priority') {
            log(t, { kind: 'activity', action: 'priority', value: after });
          }
        });
        touch('tasks', t);
        break;
      }
      case 'deleteTask': {
        var t = getTask(op.id);
        if (!canDeleteTask(state, actorId, t)) return fail('Only exec, the team lead, or whoever created the task can delete it.');
        t.deleted = true;
        touch('tasks', t);
        break;
      }
      case 'restoreTask': {
        var t = task(state, op.id);
        if (!t) return fail('Task not found.');
        if (!canDeleteTask(state, actorId, t)) return fail('Not allowed.');
        t.deleted = false;
        touch('tasks', t);
        break;
      }

      /* ----- steps ----- */
      case 'addStep': {
        var t = getTask(op.taskId);
        requireEdit(t);
        var s = newStep(op.step && op.step.text, { id: (op.step && op.step.id) || uid('s'), assignee: op.step && op.step.assignee || null, due: op.step && op.step.due || null });
        if (!s.text) return fail('Step is empty.');
        t.steps = t.steps || [];
        var idx = typeof op.index === 'number' ? op.index : t.steps.length;
        t.steps.splice(idx, 0, s);
        if (s.assignee && s.assignee !== actorId) emit('stepAssigned', t, [s.assignee], { stepText: s.text });
        touch('tasks', t);
        break;
      }
      case 'updateStep': {
        var t = getTask(op.taskId);
        var s = byId(t.steps || [], op.stepId);
        if (!s) return fail('Step not found.');
        var p = op.patch || {};
        var onlyToggle = Object.keys(p).length === 1 && 'done' in p;
        if (onlyToggle ? !canToggleStep(state, actorId, t, s) : !canEditTask(state, actorId, t)) {
          return fail('You can only tick off steps assigned to you on another team\'s task.');
        }
        if ('text' in p) { var txt = trimStr(p.text, 500); if (txt) s.text = txt; }
        if ('assignee' in p && p.assignee !== s.assignee) {
          s.assignee = p.assignee || null;
          if (s.assignee) emit('stepAssigned', t, [s.assignee], { stepText: s.text });
        }
        if ('due' in p) s.due = p.due || null;
        if ('done' in p && !!p.done !== s.done) {
          s.done = !!p.done;
          s.doneAt = s.done ? at : null;
          s.doneBy = s.done ? actorId : null;
          if (s.done) log(t, { kind: 'activity', action: 'step', value: s.text });
        }
        touch('tasks', t);
        break;
      }
      case 'deleteStep': {
        var t = getTask(op.taskId);
        requireEdit(t);
        t.steps = (t.steps || []).filter(function (s) { return s.id !== op.stepId; });
        touch('tasks', t);
        break;
      }
      case 'reorderSteps': {
        var t = getTask(op.taskId);
        requireEdit(t);
        var order = op.order || [];
        var map = {};
        (t.steps || []).forEach(function (s) { map[s.id] = s; });
        var next = [];
        order.forEach(function (id) { if (map[id]) { next.push(map[id]); delete map[id]; } });
        Object.keys(map).forEach(function (id) { next.push(map[id]); });
        t.steps = next;
        touch('tasks', t);
        break;
      }
      case 'applyTemplate': {
        var t = getTask(op.taskId);
        requireEdit(t);
        var tpl = byId(state.templates, op.templateId);
        if (!tpl || tpl.deleted) return fail('Checklist not found.');
        t.steps = t.steps || [];
        (tpl.steps || []).forEach(function (st) {
          var due = null;
          if (t.dueDate && typeof st.offsetDays === 'number') due = addDays(t.dueDate, st.offsetDays);
          t.steps.push(newStep(st.text, { due: due }));
        });
        (tpl.links || []).forEach(function (l) {
          t.links = t.links || [];
          t.links.push({ id: uid('l'), title: l.title, url: l.url, kind: linkKind(l.url), addedBy: actorId, at: at });
        });
        log(t, { kind: 'activity', action: 'template', value: tpl.name });
        touch('tasks', t);
        break;
      }

      /* ----- links & docs ----- */
      case 'addLink': {
        var t = getTask(op.taskId);
        var l = op.link || {};
        if (!isHttpUrl(l.url)) return fail('That doesn\'t look like a link (it should start with https://).');
        t.links = t.links || [];
        var link = { id: l.id || uid('l'), title: trimStr(l.title, 200) || titleFromUrl(l.url), url: trimStr(l.url, 2000), kind: l.kind || linkKind(l.url), addedBy: actorId, at: at };
        t.links.push(link);
        if (l.driveFolder) t.driveFolderId = l.driveFolder;
        log(t, { kind: 'activity', action: 'link', value: link.title });
        touch('tasks', t);
        break;
      }
      case 'updateLink': {
        var t = getTask(op.taskId);
        var link = byId(t.links || [], op.linkId);
        if (!link) return fail('Link not found.');
        if (link.addedBy !== actorId) requireEdit(t);
        if (op.patch && 'title' in op.patch) link.title = trimStr(op.patch.title, 200) || link.title;
        touch('tasks', t);
        break;
      }
      case 'removeLink': {
        var t = getTask(op.taskId);
        var link = byId(t.links || [], op.linkId);
        if (!link) return fail('Link not found.');
        if (link.addedBy !== actorId) requireEdit(t);
        t.links = t.links.filter(function (x) { return x.id !== op.linkId; });
        touch('tasks', t);
        break;
      }

      /* ----- conversation ----- */
      case 'addComment': {
        var t = getTask(op.taskId);
        var text = trimStr(op.text, 5000);
        if (!text) return fail('Comment is empty.');
        var mentioned = mentionsIn(state, text);
        log(t, { kind: 'comment', text: text, notify: mentioned.filter(function (id) { return id !== actorId; }), id: op.id });
        if (mentioned.length) emit('mention', t, mentioned, { text: text });
        // the owner hears about comments on their task even without an @mention
        if (t.owner && t.owner !== actorId && !has(mentioned, t.owner)) emit('comment', t, [t.owner], { text: text });
        touch('tasks', t);
        break;
      }
      case 'deleteComment': {
        var t = getTask(op.taskId);
        var c = byId(t.feed || [], op.commentId);
        if (!c) return fail('Comment not found.');
        if (c.by !== actorId && !isExec(actor)) return fail('You can only delete your own comments.');
        t.feed = t.feed.filter(function (x) { return x.id !== op.commentId; });
        touch('tasks', t);
        break;
      }
      case 'checkin': {
        var t = getTask(op.taskId);
        requireEdit(t);
        var health = op.health;
        if (!find(HEALTH, function (h) { return h.id === health; })) return fail('Pick on track, at risk, or off track.');
        var text = trimStr(op.text, 5000);
        t.health = health;
        t.lastCheckinAt = at;
        var leads = teamLeads(state, t.team).map(function (p) { return p.id; });
        var notifyIds = health === 'on' ? [] : leads.filter(function (id) { return id !== actorId; });
        log(t, { kind: 'checkin', health: health, text: text, notify: notifyIds, id: op.id });
        if (t.status === 'todo') {
          t.status = 'doing';
          log(t, { kind: 'activity', action: 'status', value: 'doing', from: 'todo' });
        }
        emit('checkin', t, health === 'on' ? [] : leads, { health: health, text: text });
        touch('tasks', t);
        break;
      }
      case 'requestHelp': {
        var t = getTask(op.taskId);
        var to = op.to;
        if (!person(state, to)) return fail('Pick who you need help from.');
        var h = { id: op.id || uid('h'), from: actorId, to: to, message: trimStr(op.message, 2000), at: at, status: 'open', resolvedAt: null, resolvedBy: null };
        t.help = t.help || [];
        t.help.push(h);
        log(t, { kind: 'activity', action: 'help', value: to, text: h.message, notify: [to] });
        emit('help', t, [to], { message: h.message, helpId: h.id });
        touch('tasks', t);
        break;
      }
      case 'resolveHelp': {
        var t = getTask(op.taskId);
        var h = byId(t.help || [], op.helpId);
        if (!h) return fail('Help request not found.');
        if (h.from !== actorId && h.to !== actorId && !canEditTask(state, actorId, t)) return fail('Not allowed.');
        h.status = 'resolved';
        h.resolvedAt = at;
        h.resolvedBy = actorId;
        log(t, { kind: 'activity', action: 'helpResolved', value: h.to, notify: [h.from].filter(function (id) { return id !== actorId; }) });
        emit('helpResolved', t, [h.from], { helper: h.to });
        touch('tasks', t);
        break;
      }
      case 'nudge': {
        var t = getTask(op.taskId);
        if (!t.owner) return fail('Nobody owns this task yet. Assign an owner first.');
        if (t.owner === actorId) return fail('You can\'t nudge yourself.');
        if (t.lastNudgeAt && (Date.now() - new Date(t.lastNudgeAt).getTime()) < NUDGE_COOLDOWN_HOURS * 3600000) {
          return fail('Already nudged in the last ' + NUDGE_COOLDOWN_HOURS + ' hours. Give them a moment.');
        }
        t.lastNudgeAt = at;
        log(t, { kind: 'activity', action: 'nudge', value: t.owner, text: trimStr(op.message, 500), notify: [t.owner] });
        emit('nudge', t, [t.owner], { message: trimStr(op.message, 500) });
        touch('tasks', t);
        break;
      }

      /* ----- roster, teams, projects, templates, resources ----- */
      case 'join': {
        // A signed-in person who isn't on the roster yet adds themselves (as a member)
        // or claims an existing roster entry that has no email.
        var email = String(op.email || '').toLowerCase();
        if (!email) return fail('Missing email.');
        if (personByEmail(state, email)) return fail('You are already on the roster.');
        var p;
        if (op.claimId) {
          p = person(state, op.claimId);
          if (!p || p.deleted || p.email) return fail('That roster entry is already claimed.');
          if (p.role !== 'member') return fail('Exec and lead entries are linked by an exec. Ask one to add your email.');
          p.email = email;
        } else {
          var pp = op.person || {};
          if (!trimStr(pp.name)) return fail('Please enter your name.');
          p = { id: uid('p'), name: trimStr(pp.name, 80), email: email, role: 'member', teams: (pp.teams || []).filter(function (tid) { return team(state, tid); }), title: trimStr(pp.title, 80), slackId: '', createdAt: at };
          state.people.push(p);
        }
        touch('people', p);
        break;
      }
      case 'upsert': {
        var coll = op.coll;
        var item = op.item || {};
        if (['teams', 'people', 'projects', 'templates', 'resources'].indexOf(coll) === -1) return fail('Unknown collection.');
        var existing = item.id ? byId(state[coll], item.id) : null;
        if (coll === 'teams' && !isExec(actor)) return fail('Only exec can change teams.');
        if (coll === 'people') {
          if (!existing && !canManagePeople(state, actorId)) return fail('Only exec and team leads can add people.');
          if (!existing && item.role && item.role !== 'member' && !isExec(actor)) return fail('Only exec can add leads or exec members.');
          if (existing && !canEditPerson(state, actorId, existing, item)) return fail('You can\'t change that person\'s details.');
          if (!existing && actor.role === 'lead' && !(item.teams || []).every(function (tid) { return isLeadOf(actor, tid); })) return fail('Leads can only add people to their own team.');
          if (item.email) {
            var dup = personByEmail(state, item.email);
            if (dup && dup.id !== item.id) return fail(item.email + ' is already on the roster as ' + dup.name + '.');
          }
        }
        if (coll === 'projects') {
          if (!team(state, item.team || (existing && existing.team))) return fail('Projects belong to a team.');
          if (existing ? !canEditProject(state, actorId, existing) : !(isExec(actor) || isLeadOf(actor, item.team) || has(actor.teams, item.team))) return fail('Only exec and the team can create projects for this team.');
        }
        if ((coll === 'templates' || coll === 'resources') && existing && !canEditShared(state, actorId, existing)) {
          return fail('Only whoever added this, exec, or the team lead can change it.');
        }
        if (coll === 'resources' && item.url !== undefined && !isHttpUrl(item.url)) return fail('That doesn\'t look like a link (it should start with https://).');
        var target = existing;
        if (!target) {
          target = { id: item.id || uid(coll.charAt(0)), createdBy: actorId, createdAt: at };
          state[coll].push(target);
        }
        Object.keys(item).forEach(function (k) {
          if (k === 'id' || k === 'createdBy' || k === 'createdAt' || k === 'updatedAt') return;
          target[k] = clone(item[k]);
        });
        if (coll === 'resources' && target.url) target.kind = linkKind(target.url);
        if (coll === 'people' && target.email) target.email = String(target.email).toLowerCase().trim();
        touch(coll, target);
        break;
      }
      case 'remove': {
        var coll = op.coll;
        var item = byId(state[coll] || [], op.id);
        if (!item) return fail('Not found.');
        if (coll === 'teams' && !isExec(actor)) return fail('Only exec can remove teams.');
        if (coll === 'people' && !(isExec(actor) || (actor.role === 'lead' && canEditPerson(state, actorId, item, {})))) return fail('Not allowed.');
        if (coll === 'projects' && !canEditProject(state, actorId, item)) return fail('Not allowed.');
        if ((coll === 'templates' || coll === 'resources') && !canEditShared(state, actorId, item)) return fail('Not allowed.');
        item.deleted = true;
        touch(coll, item);
        break;
      }
      default:
        return fail('Unknown change: ' + op.type);
    }
    return { ok: true, changed: changed, events: events };
  }

  function teamName(state, id) {
    var t = team(state, id);
    return t ? t.name : 'owning';
  }

  /* ---------- digests (used by the daily Slack summary and the dashboard) ---------- */
  function personDigest(state, pid, today) {
    today = today || todayKey();
    var mine = activeTasks(state).filter(function (t) { return !isDone(t) && involves(t, pid); });
    return {
      overdue: mine.filter(function (t) { return isOverdue(t, today); }).sort(compareTasks),
      today: mine.filter(function (t) { return t.dueDate === today; }).sort(compareTasks),
      soon: mine.filter(function (t) { return t.dueDate && t.dueDate > today && daysBetween(today, t.dueDate) <= 3; }).sort(compareTasks),
      stale: mine.filter(function (t) { return t.owner === pid && isStale(t); }),
      helpForMe: activeTasks(state).filter(function (t) { return openHelp(t).some(function (h) { return h.to === pid; }); })
    };
  }
  function teamDigest(state, teamId, today) {
    today = today || todayKey();
    var all = activeTasks(state).filter(function (t) { return t.team === teamId; });

    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, function (m, pre, url) {

  }
  function shortUrl(u) {

    if (!m) return u;

  }
  function highlightMentions(s) {
    if (s.indexOf('@') === -1) return s;
    var names = [];
    C.activePeople(App.S.state).forEach(function (p) {
      var full = esc(p.name);
      names.push(full, full.split(' ')[0]);

    if (!names.length) return s;
    names.sort(function (a, b) { return b.length - a.length; });

  function escapeRe(x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function md(src) {

    var html = '', list = null, para = [];
    function flushPara() { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } }
    function flushList() { if (list) { html += '</' + list + '>'; list = null; } }
    lines.forEach(function (line) {
      var ul = /^\s*[-*•]\s+(.*)$/.exec(line), ol = /^\s*\d+[.)]\s+(.*)$/.exec(line), hd = /^#{1,4}\s+(.*)$/.exec(line);
      if (ul || ol) {

        var body = (ul || ol)[1];

      } else if (hd) {
        flushPara(); flushList();
        html += '<h4>' + inline(hd[1]) + '</h4>';

  App.md = md;
  App.inline = function (s) { return inline(esc(s)); };

  /* ---------- link kind badge ---------- */
  var KIND = {
    doc: ['DOC', '#4285f4'], sheet: ['XLS', '#0f9d58'], slides: ['PPT', '#f4b400'], form: ['FORM', '#7248b9'],
    folder: ['DIR', '#5f6368'], drive: ['FILE', '#5f6368'], pdf: ['PDF', '#d93025'], github: ['GH', '#24292f'],
    slack: ['#', '#4a154b'], calendar: ['CAL', '#1a73e8'], notion: ['N', '#111'], design: ['ART', '#00c4cc'], link: ['URL', '#94a3b8']
  };
  App.kindIcon = function (kind) {
    var k = KIND[kind] || KIND.link;
    return '<span class="kind-ico" style="background:' + k[1] + ';font-size:' + (k[0].length > 3 ? 8.5 : 10) + 'px">' + k[0] + '</span>';
  };
  App.KIND_LABELS = { doc: 'Google Docs', sheet: 'Google Sheets', slides: 'Google Slides', form: 'Google Forms', folder: 'Drive folders', drive: 'Drive files', pdf: 'PDFs', github: 'GitHub', slack: 'Slack', calendar: 'Calendar', notion: 'Notion', design: 'Design', link: 'Other links' };

  /* ---------- toasts ---------- */
  App.toast = function (msg, opts) {
    opts = opts || {};

    el.className = 'toast' + (opts.type ? ' ' + opts.type : '');
    var ico = opts.type === 'err' ? '⚠️' : opts.type === 'slack' ? '💬' : opts.icon || '✓';
    el.innerHTML = '<span class="t-ico">' + ico + '</span><span>' + (opts.html ? msg : esc(msg)) + '</span>' + (opts.action ? '<button type="button">' + esc(opts.action.label) + '</button>' : '');
    if (opts.action) el.querySelector('button').onclick = function () { opts.action.fn(); el.remove(); };

  /* ---------- popovers ---------- */
  var openPop = null;
  function closePop() { if (openPop) { openPop.remove(); openPop = null; } }
  App.closePop = closePop;
  App.hasPop = function () { return !!openPop; };
  function placePop(pop, anchor) {
    var r = anchor.getBoundingClientRect();
    document.body.appendChild(pop);
    var pw = pop.offsetWidth, ph = pop.offsetHeight;

  /* items: [{id, label, sub, html(left decoration), group}] */
  App.pick = function (anchor, opts, onSelect) {
    closePop();
    var selected = (opts.selected || []).slice();
    var pop = document.createElement('div');
    pop.className = 'pop';
    pop.innerHTML = (opts.search === false ? '' : '<input class="pop-search" placeholder="' + esc(opts.placeholder || 'Search…') + '">') + '<div class="pop-list"></div>';
    var list = pop.querySelector('.pop-list');
    var input = pop.querySelector('input');
    var hl = 0, visible = [];
    function draw() {
      var q = input ? input.value.trim().toLowerCase() : '';
      visible = opts.items.filter(function (it) { return !q || (it.label + ' ' + (it.sub || '')).toLowerCase().indexOf(q) !== -1; });
      var html = '', lastGroup = null;
      visible.forEach(function (it, i) {
        if (it.group && it.group !== lastGroup && !q) { html += '<div class="pop-group">' + esc(it.group) + '</div>'; lastGroup = it.group; }
        var checked = selected.indexOf(it.id) !== -1;
        html += '<button type="button" class="pop-item' + (i === hl ? ' hl' : '') + (checked ? ' checked' : '') + '" data-i="' + i + '">' + (it.html || '') + '<span>' + esc(it.label) + '</span>' + (it.sub && !checked ? '<span class="sub">' + esc(it.sub) + '</span>' : '') + '</button>';
      });
      list.innerHTML = html || '<div class="pop-group">No matches</div>';
    }
    function choose(i) {
      var it = visible[i];

      if (opts.multi) {

    list.addEventListener('mousedown', function (e) { e.preventDefault(); });

  };
  /* menu items: [{label, icon, fn, danger}] or 'sep' */
  App.menu = function (anchor, items) {
    closePop();

    pop.className = 'pop';

  };
  document.addEventListener('mousedown', function (e) {
    if (openPop && !openPop.contains(e.target)) closePop();

  /* people picker items, grouped by team with the given team first */
  App.peopleItems = function (firstTeam, opts) {
    var st = App.S.state;
    var items = [];
    if (opts && opts.allowNone) items.push({ id: null, label: 'Unassigned', html: avatar(null, 'sm') });
    var teams = st.teams.filter(function (t) { return !t.deleted; }).slice();
    teams.sort(function (a, b) { return (a.id === firstTeam ? -1 : 0) - (b.id === firstTeam ? -1 : 0); });
    var seen = {};
    teams.forEach(function (t) {
      C.activePeople(st).filter(function (p) { return C.has(p.teams, t.id); })
        .sort(function (a, b) { return (a.role === 'lead' ? -1 : 0) - (b.role === 'lead' ? -1 : 0) || a.name.localeCompare(b.name); })
        .forEach(function (p) {
          if (seen[p.id]) return;

  /* ---------- modals ---------- */

      (o.title ? '<div class="modal-head"><h2>' + esc(o.title) + '</h2><span style="flex:1"></span><button type="button" class="icon-btn" data-close aria-label="Close">' + icon('x') + '</button></div>' : '') +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '') + '</div>';

    if (first) setTimeout(function () { first.focus(); }, 30);
    return api;
  };
  App.closeTopModal = function () {
    var m = modalStack[modalStack.length - 1];
    if (m) { m.close(); return true; }
    return false;
  };
  App.hasModal = function () { return modalStack.length > 0; };
  App.confirm = function (msg, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var done = false;
      var m = App.modal({
        title: opts.title || 'Are you sure?',
        body: '<p style="margin:0;line-height:1.5">' + esc(msg) + '</p>',
        foot: '<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-ok>' + esc(opts.ok || 'OK') + '</button>',
        onMount: function (el, api) {
          el.querySelector('[data-ok]').onclick = function () { done = true; api.close(); resolve(true); };
          setTimeout(function () { el.querySelector('[data-ok]').focus(); }, 40);
        },
        onClose: function () { if (!done) resolve(false); }

      return m;
    });
  };

  /* ---------- misc ---------- */
  App.copyText = function (text) {
    function fallback() {
      var ta = document.createElement('textarea');

    }

  App.download = function (filename, text) {
    var a = document.createElement('a');

    document.body.appendChild(a); a.click(); a.remove();
  };
  App.plural = function (n, word, pl) { return n + ' ' + (n === 1 ? word : (pl || word + 's')); };

<script>
/* app-views.js */
/* Tracker pages: sidebar, home, inbox, dashboard, task views (list/board/timeline), people, docs, settings. */
(function (App) {
  'use strict';
  var C = App.C, esc = App.esc, icon = App.icon;
  var V = App.views = {};

  function st() { return App.S.state; }
  function me() { return App.me(); }
  function liveTeams() { return st().teams.filter(function (t) { return !t.deleted; }); }
  function liveProjects(teamId) {
    return st().projects.filter(function (p) { return !p.deleted && !p.archived && (!teamId || p.team === teamId); });
  }
  V.liveTeams = liveTeams;
  V.liveProjects = liveProjects;

  /* ======================= sidebar ======================= */
  V.sidebar = function () {
    var r = App.S.route, m = me();
    var inboxCount = V.inboxItems().filter(function (i) { return i.unread; }).length;
    var myOverdue = C.activeTasks(st()).filter(function (t) { return C.involves(t, m.id) && C.isOverdue(t); }).length;
    function item(path, ico, label, extra, active) {
      return '<a class="nav-item' + (active ? ' active' : '') + '" href="#/' + path + '">' + icon(ico, 18) + '<span>' + label + '</span>' + (extra || '') + '</a>';
    }
    var html = '<div class="brand"><div class="brand-mark">AIS</div><div><div class="brand-name">AI Safety @ UChicago</div><div class="brand-sub">Team tracker</div></div></div>';
    html += item('home', 'home', 'My work', myOverdue ? '<span class="count" title="Overdue">' + myOverdue + '</span>' : '', r.path === 'home');
    html += item('inbox', 'inbox', 'Inbox', inboxCount ? '<span class="count">' + inboxCount + '</span>' : '', r.path === 'inbox');
    html += item('dashboard', 'chart', 'Dashboard', '', r.path === 'dashboard');
    html += item('all', 'list', 'All tasks', '', r.path === 'all');
    html += item('docs', 'docs', 'Docs & checklists', '', r.path === 'docs');
    html += item('people', 'people', 'People', '', r.path === 'people' || r.path === 'person');
    html += '<div class="nav-section"><span>Teams</span></div>';
    liveTeams().forEach(function (t) {

      if (r.path === 'team' && r.id === t.id || (r.path === 'project' && (C.byId(st().projects, r.id) || {}).team === t.id)) {
        liveProjects(t.id).forEach(function (p) {
          html += '<a class="nav-item' + (r.path === 'project' && r.id === p.id ? ' active' : '') + '" style="padding-left:30px;font-size:13px" href="#/project/' + esc(p.id) + '">' + icon('target', 14) + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.name) + '</span></a>';
        });

    html += '<div class="sidebar-foot">';
    html += item('settings', 'settings', 'Settings', '', r.path === 'settings');
    html += '<button type="button" class="me-card" data-act="meMenu">' + App.avatar(m.id) + '<div style="min-width:0"><div class="me-name">' + esc(m.name) + '</div><div class="me-role">' + esc(m.title || App.roleLabel(m.role)) + (App.S.mode === 'demo' ? ' · switch user ▾' : '') + '</div></div></button>';
    if (App.S.mode === 'demo') {
      html += '<div class="mode-pill"><b>Demo mode.</b> Data lives only in this browser. Click your name to view as someone else. <a href="#/settings" style="color:#ffe3a3;text-decoration:underline">Connect Google &amp; Slack</a></div>';
    } else {
      html += '<div class="mode-pill live"><span class="sync-dot ' + (App.S.sync === 'busy' ? 'busy' : App.S.sync === 'err' ? 'err' : '') + '"></span> ' + (App.S.sync === 'err' ? 'Sync problem: retrying' : App.S.sync === 'busy' ? 'Saving…' : 'Synced with Google Sheets') + '</div>';
    }
    html += '</div>';
    return html;
  };

  /* ======================= shared task rendering ======================= */
  function flags(t, opts) {
    var out = [];
    if (C.isDone(t)) return '';

  V.miniProgress = miniProgress;
  function taskRow(t, opts) {

      '<button type="button" class="check' + (C.isDone(t) ? ' on' : '') + '" data-act="toggleDone" data-id="' + esc(t.id) + '" aria-label="' + (C.isDone(t) ? 'Mark incomplete' : 'Mark complete') + '" title="' + (C.isDone(t) ? 'Mark incomplete' : 'Mark complete') + '">' + icon('check', 12) + '</button>' +
      '<div style="min-width:0"><div class="title">' + esc(t.title) + '</div>' +
      '<div class="sub">' + (opts.showTeam !== false ? App.teamChip(t.team) : '') + (opts.showProject !== false ? App.projectChip(t.project) : '') + flags(t) + miniProgress(t) + '</div></div>' +
      '<div class="meta"><span class="hide-sm">' + App.statusPill(t.status) + '</span>' + App.dueHtml(t) + App.avatar(t.owner) + '</div></div>';
  }
  V.taskRow = taskRow;

  function groupTasks(tasks, by) {
    var groups = [];
    function add(key, label, color, list) { if (list.length || key === '_always') groups.push({ key: key, label: label, color: color, tasks: list }); }
    if (by === 'status') {
      C.STATUSES.forEach(function (s) { add(s.id, s.label, s.color, tasks.filter(function (t) { return t.status === s.id; })); });
    } else if (by === 'due') {
      [['overdue', 'Overdue', '#dc2626'], ['today', 'Due today', '#d97706'], ['week', 'Next 7 days', '#2563eb'], ['later', 'Later', '#64748b'], ['nodate', 'No due date', '#94a3b8'], ['done', 'Completed', '#16a34a']].forEach(function (g) {
        add(g[0], g[1], g[2], tasks.filter(function (t) { return C.dueBucket(t) === g[0]; }));
      });
    } else if (by === 'owner') {
      var ids = [];
      tasks.forEach(function (t) { if (ids.indexOf(t.owner || '') === -1) ids.push(t.owner || ''); });
      ids.sort(function (a, b) { return a ? (b ? App.pname(a).localeCompare(App.pname(b)) : -1) : 1; });
      ids.forEach(function (id) { add('o' + id, id ? App.pname(id) : 'Unassigned', id ? App.avColor(id) : '#94a3b8', tasks.filter(function (t) { return (t.owner || '') === id; })); });
    } else if (by === 'project') {
      st().projects.filter(function (p) { return !p.deleted; }).forEach(function (p) { add(p.id, p.name, p.color || '#64748b', tasks.filter(function (t) { return t.project === p.id; })); });
      add('none', 'No project', '#94a3b8', tasks.filter(function (t) { return !t.project || !C.byId(st().projects, t.project) || C.byId(st().projects, t.project).deleted; }));
    } else if (by === 'team') {
      liveTeams().forEach(function (tm) { add(tm.id, tm.name, tm.color, tasks.filter(function (t) { return t.team === tm.id; })); });
    } else {
      add('all', 'Tasks', '#64748b', tasks);
    }
    groups.forEach(function (g) { g.tasks.sort(C.compareTasks); });
    return groups;
  }

  };
  function stat(n, label, cls, act, arg) {

  function attentionCard() {

        if (h.to === m.id) items.push({ rank: 0, html: '<div class="attention-item" data-act="openTask" data-id="' + esc(t.id) + '">' + App.avatar(h.from, 'sm') + '<div style="flex:1;min-width:0"><div class="ai-title">' + esc(App.firstName(h.from)) + ' needs your help</div><div class="ai-sub"><b>' + esc(t.title) + '</b>' + (h.message ? '<br>“' + esc(h.message) + '”' : '') + '</div><div class="ai-sub muted">' + App.relTime(h.at) + '</div></div><button type="button" class="btn sm" data-act="resolveHelp" data-id="' + esc(t.id) + '" data-help="' + esc(h.id) + '">Done</button></div>' });

  /* ======================= Inbox ======================= */
  V.inboxItems = function () {

        '<div class="row" style="gap:8px">' + App.avatars(leads.map(function (p) { return p.id; }), 'sm') + '<span class="muted" style="font-size:12px">' + esc(leads.map(function (p) { return p.name.split(' ')[0]; }).join(', ') || 'No lead set') + '</span></div>' +

        }).join('') + '</tbody></table></div>';
